<title id="t">Which models ran where</title>
<desc id="d">Which models ran where. Browser, WebGPU: 69 loaded and ran with no fallback or mismatch recorded, 61 fell back, gave wrong output, or failed to load or run. Browser, WASM: 108 loaded and ran with no fallback or mismatch recorded, 22 fell back, gave wrong output, or failed to load or run. Galaxy S26, GPU: 56 loaded and ran with no fallback or mismatch recorded, 3 fell back, gave wrong output, or failed to load or run. Galaxy S26, NPU: 55 loaded and ran with no fallback or mismatch recorded, 7 fell back, gave wrong output, or failed to load or run. Raspberry Pi 5, CPU: 87 loaded and ran with no fallback or mismatch recorded, 0 fell back, gave wrong output, or failed to load or run.</desc>
